<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eletro+ Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav a {
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    nav a:hover {
      background-color: #27ae60;
    }
    .produto {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 8px;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .produto img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .produto h2 {
      color: #2c3e50;
    }
    .produto p {
      color: #34495e;
    }
    button {
      background-color: #27ae60;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>

  <header>
    <h1>Eletro+ Store</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <div class="produto">
    <img src="fone.jpg" alt="Fone de Ouvido Bluetooth">
    <h2>Fone de Ouvido Bluetooth</h2>
    <p>Preço: 5.000 Kz</p>
    <a href="https://teu-link-de-pagamento.com" target="_blank">
      <button>Comprar agora</button>
    </a>
  </div>

  <div class="produto">
    <img src="perfume.jpg" alt="Perfume Importado 50ml">
    <h2>Perfume Importado 50ml</h2>
    <p>Preço: 8.000 Kz</p>
    <a href="https://teu-link-de-pagamento.com" target="_blank">
      <button>Comprar agora</button>
    </a>
  </div>

  <div class="produto">
    <img src="carregador.jpg" alt="Carregador Rápido USB-C">
    <h2>Carregador Rápido USB-C</h2>
    <p>Preço: 2.500 Kz</p>
    <a href="https://teu-link-de-pagamento.com" target="_blank">
      <button>Comprar agora</button>
    </a>
  </div>

  <div class="produto">
    <img src="capinha.jpg" alt="Capinha para Celular">
    <h2>Capinha para Celular</h2>
    <p>Preço: 1.000 Kz</p>
    <a href="https://teu-link-de-pagamento.com" target="_blank">
      <button>Comprar agora</button>
    </a>
  </div>

</body>
</html>
