<!DOCTYPE html>
<html lang="pt">
<head>

  <title>Eletro+ Store</title>

      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {

    }

<body>
  <h1>Bem-vindo à Eletro+!</h1>

    <p>Preço: 5.000 Kz</p>
    <a href="https://teu-link-de-pagamento.com" target="_blank">
      <button>Comprar agora</button>
    </a>
  </div>

  <div class="produto">

    <p>Preço: 8.000 Kz</p>

</html>
